  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;

<body>
    <h1>LISTA DE CERTIFICAÇÕES</h1>
    <ul id="lista-pdf">
    </ul>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const lista = document.getElementById('lista-pdf');

            fetch('./lista.txt') // Caminho para o arquivo lista.txt
                .then(response => response.text())
                .then(text => {
                    // Dividir o texto em linhas e remover linhas em branco
                    const lines = text.split('\n').filter(line => line.trim() !== '');

                    lines.forEach(fileName => {
                        const listItem = document.createElement('li');
                        const link = document.createElement('a');
                        link.href = 'https://andredfaria.github.io/certificados/' + fileName.trim(); // Caminho para a pasta /pdfs/
                        link.textContent = fileName.trim();
                        listItem.appendChild(link);
                        lista.appendChild(listItem);
                    });
                })
                .catch(error => console.error('Erro ao carregar lista de arquivos:', error));
        });
    </script>
</body>

</html>
